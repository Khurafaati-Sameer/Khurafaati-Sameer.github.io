<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Khurafaati Sameer — individual project case studies in web, writing and cinematic visual creation.">
<meta name="theme-color" content="#070707">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta property="og:type" content="website"><meta property="og:title" content="Project — KHURAFAATI SAMEER"><meta property="og:description" content="Explore the idea, design, creation and final result behind a Khurafaati Sameer project."><meta property="og:url" content="https://khurafaati-sameer.github.io/project-case-study.html">
<title>Project — KHURAFAATI SAMEER</title>
<style>
:root{--bg:#070707;--panel:#101010;--text:#f4f1eb;--muted:#918d86;--line:#ffffff18;--gold:#d9a441;--max:1180px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,#18130d,#070707 42%,#030303);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}header{position:relative;z-index:20;background:#070707f2;border-bottom:1px solid var(--line)}nav{height:72px;max-width:var(--max);margin:auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:13px;font-weight:800;letter-spacing:.12em}.logo span{color:var(--gold)}.back{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#aaa}.hero{max-width:var(--max);margin:auto;padding:90px 24px 70px;display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}.eyebrow,.label{font-size:9px;text-transform:uppercase;letter-spacing:.24em;color:var(--gold)}h1{font-size:clamp(50px,7vw,94px);line-height:.88;letter-spacing:-.06em;margin:18px 0}h1 em{display:block;font:500 .42em 'Playfair Display',serif;color:#aaa;letter-spacing:0;margin-top:20px}.intro{color:var(--muted);max-width:620px;font-size:15px}.hero-img{border:1px solid var(--line);background:#0d0d0d;padding:9px;box-shadow:0 35px 90px #000}.hero-img img{width:100%;height:560px;object-fit:cover;display:block}.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.pill{border:1px solid var(--line);padding:7px 10px;color:#aaa;font-size:8px;text-transform:uppercase;letter-spacing:.12em}.case{max-width:900px;margin:auto;padding:15px 24px 100px}.step{padding:55px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:180px 1fr;gap:35px}.step-num{font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}.step h2{font-size:clamp(30px,4vw,48px);line-height:1;margin:0 0 16px;letter-spacing:-.04em}.step p{color:#999;font-size:14px;margin:0;max-width:650px}.quote{margin-top:28px;border-left:1px solid var(--gold);padding:10px 0 10px 18px;color:#ddd;font:italic 19px 'Playfair Display',serif}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.gallery img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border:1px solid var(--line);transition:transform .4s ease,filter .4s ease}.gallery img:hover{transform:translateY(-4px);filter:brightness(1.08)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid var(--line);padding:12px 16px;font-size:9px;text-transform:uppercase;letter-spacing:.15em;transition:.25s}.btn:hover{transform:translateY(-2px);border-color:#fff}.btn.primary{background:var(--gold);color:#080808;border-color:var(--gold)}.error{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px}.error h1{font-size:48px}.error a{color:var(--gold)}footer{border-top:1px solid var(--line);padding:40px 24px;color:#666;font-size:9px;text-transform:uppercase;letter-spacing:.12em;text-align:center}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:65px;gap:35px}.hero-img img{height:480px}.step{grid-template-columns:1fr;gap:12px}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){nav{padding:0 17px}.hero,.case{padding-left:17px;padding-right:17px}.hero-img img{height:430px}.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><nav><a class="logo" href="index.html">KHURAFAATI <span>SAMEER</span></a><a class="back" href="projects.html">← All projects</a></nav></header>
<div id="app"></div>
<footer>KHURAFAATI SAMEER · Real stories. Raw feelings. Digital creations.</footer>
<script>
const projects={
 adhuri:{eyebrow:'04 — Writing / Novel',title:'अधूरी मोहब्बत',sub:'My First Novel',desc:'A long-form storytelling project where memory, relationships and unfinished emotions are shaped into a cinematic world of written words.',image:'adhuri-mohabbat-cover.jpg',tags:['Writing','Storytelling','Cinematic','Novel'],problem:'Some stories are too emotional to fit into a short caption or a single frame. This project began with the idea of giving an unfinished feeling enough space to become a complete world.',idea:'Turn emotion into narrative — then let the visual identity feel like a film before the first page is even read.',design:'A dark, restrained visual language with cinematic contrast, editorial typography and imagery built around absence, rain, memory and unfinished love.',creation:'The writing, title treatment and visual concepts were developed as one connected creative direction, so the words and visuals feel like parts of the same story.',result:'A distinct novel identity with a visual archive that can grow into covers, teasers, reels and future launch material.',quote:'Kitabon mein to sirf lafz hote hain... maine usmein zindagi likh di hai.',gallery:['adhuri-mohabbat-cover.jpg','adhuri-mohabbat-coming-soon.jpg','adhuri-mohabbat-rainy-street.jpg']},
 anshan:{eyebrow:'05 — Creative / Visual Series',title:'ANSHAN',sub:'Cinematic Visual Series',desc:'AI-assisted cinematic posters and visual storytelling exploring voice, identity, protest, atmosphere and character.',image:'anshan-haq-le-kar-rahenge.jpg',tags:['AI Visuals','Posters','Creative','Campaign'],problem:'A powerful idea needs a visual language that can stop the scroll and communicate a mood instantly. ANSHAN became a canvas for that experiment.',idea:'Build a recognisable cinematic identity around voice, resistance and atmosphere — using each poster as a frame from a larger visual world.',design:'High-contrast poster composition, dramatic typography, restrained palettes and recurring visual motifs create continuity across the series.',creation:'Concepts were translated into AI-assisted visuals, then curated and presented as a coherent collection rather than isolated images.',result:'A growing visual series that demonstrates how an idea can move from words and mood into a repeatable creative system.',quote:'Ek awaaz. Ek jung. Ek tasveer se aage — ek visual language.',gallery:['anshan-awaaz-nahi.jpg','anshan-haq-le-kar-rahenge.jpg','anshan-sach-ka-imtihaan.jpg','anshan-ek-awaaz-ek-jung.jpg','anshan-ek-taraf.jpg','anshan-justice-for-ladakh.jpg','anshan-awaaz-ko-koi-rokega-nahi.jpg']},
 portfolio:{eyebrow:'01 — Web / Portfolio',title:'Khurafaati Sameer',sub:'Personal Portfolio',desc:'A cinematic personal-brand website combining storytelling, writing, digital creativity and professional identity.',image:'sameer-portrait-web.jpg',tags:['HTML','CSS','JavaScript','Responsive'],problem:'A personal portfolio should communicate more than a list of skills. It should make the person, the work and the creative point of view feel connected.',idea:'Create a dark editorial home for the Khurafaati Sameer identity — part portfolio, part story, part creative archive.',design:'Charcoal surfaces, warm gold accents, editorial typography, generous spacing and subtle motion keep the interface premium without becoming noisy.',creation:'Built as a responsive static website with semantic HTML, custom CSS and lightweight JavaScript interactions.',result:'A live personal brand experience that gives web work, writing, visuals and professional identity one coherent home.',quote:'Doctor hona meri qualification hai. Writer hona meri awaaz. Creator hona meri aadat.',gallery:['sameer-portrait-web.jpg']}
};
function render(p){document.title=p.title+' — KHURAFAATI SAMEER';const imgs=p.gallery.map(x=>`<img src="${x}" alt="${p.title} visual" loading="lazy" decoding="async">`).join('');const archive=p===projects.adhuri?'visual-gallery.html#adhuri':p===projects.anshan?'visual-gallery.html#anshan':'projects.html';const archiveLabel=p===projects.portfolio?'Back to portfolio':'View full visual archive →';document.getElementById('app').innerHTML=`<main><section class="hero"><div><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}<em>${p.sub}</em></h1><p class="intro">${p.desc}</p><div class="meta-row">${p.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div><div class="hero-img"><img src="${p.image}" alt="${p.title}" loading="eager" fetchpriority="high" decoding="async"></div></section><section class="case"><article class="step"><div class="step-num">01 · Problem</div><div><h2>The starting point.</h2><p>${p.problem}</p></div></article><article class="step"><div class="step-num">02 · Idea</div><div><h2>The idea.</h2><p>${p.idea}</p><div class="quote">“${p.quote}”</div></div></article><article class="step"><div class="step-num">03 · Design</div><div><h2>The visual language.</h2><p>${p.design}</p></div></article><article class="step"><div class="step-num">04 · Creation</div><div><h2>Making it real.</h2><p>${p.creation}</p></div></article><article class="step"><div class="step-num">05 · Final Result</div><div><h2>What it became.</h2><p>${p.result}</p><div class="gallery">${imgs}</div><div class="actions"><a class="btn primary" href="${archive}">${archiveLabel}</a><a class="btn" href="projects.html">Back to projects</a></div></div></article></section></main>`}
const key=new URLSearchParams(location.search).get('project');if(projects[key])render(projects[key]);else document.getElementById('app').innerHTML='<main class="error"><div><div class="eyebrow">Project not found</div><h1>Nothing here yet.</h1><a href="projects.html">← Back to projects</a></div></main>';
</script>
</body>
</html>
