<style>
.case-hero{padding:150px var(--pad) 80px;background:var(--cream)}
.case-wrap{max-width:var(--max);margin:auto}
.case-kicker{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.case-grid{display:grid;grid-template-columns:1fr .9fr;gap:clamp(45px,8vw,120px);align-items:end;margin-top:55px}
.case-title{font:500 clamp(58px,8vw,125px)/.78 var(--display);letter-spacing:-.06em;margin:0}
.case-title em{display:block;color:var(--wine);font:italic .58em var(--serif);margin-top:22px}
.case-intro{max-width:620px;color:#554d45;font-size:17px;margin:32px 0 0}
.case-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.case-pill{border:1px solid var(--line);padding:7px 9px;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.case-image{margin:0;background:var(--paper);padding:10px}
.case-image img{aspect-ratio:4/5;object-fit:cover}
.case-image figcaption{padding:10px 2px 0;font-size:7px;letter-spacing:.15em;color:var(--muted)}
.case-body{background:var(--beige);padding:0 var(--pad) 120px}
.case-step{max-width:var(--max);margin:auto;border-top:1px solid var(--line);padding:65px 0;display:grid;grid-template-columns:170px 1fr;gap:45px}
.case-step:first-child{border-top:0}
.case-num{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--wine)}
.case-step h2{font:500 clamp(38px,5vw,70px)/.82 var(--display);letter-spacing:-.05em;margin:0 0 18px}
.case-step p{max-width:700px;color:#554d45;font-size:15px;margin:0}
.case-quote{margin-top:28px;border-left:2px solid var(--wine);padding:8px 0 8px 18px;font:italic 22px/1.2 var(--serif);max-width:680px}
.case-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}
.case-gallery figure{margin:0;background:var(--ink);overflow:hidden}
.case-gallery img{aspect-ratio:4/5;object-fit:cover;transition:transform .5s}
.case-gallery figure:hover img{transform:scale(1.025)}
.case-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:35px}
.case-actions a{display:inline-flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--line);font-size:8px;letter-spacing:.15em;text-transform:uppercase}
.case-actions a.primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.case-actions a:hover{border-color:var(--wine);color:var(--wine)}
.case-actions a.primary:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
.case-not-found{min-height:70vh;display:grid;place-items:center;text-align:center;padding:120px var(--pad)}
.case-not-found h1{font:500 clamp(55px,8vw,100px)/.8 var(--display);margin:18px 0}
.case-not-found a{color:var(--wine)}
@media(max-width:850px){.case-grid{grid-template-columns:1fr}.case-image{max-width:620px}.case-step{grid-template-columns:1fr;gap:14px}.case-gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.case-hero{padding-top:115px}.case-kicker span:last-child{display:none}.case-title{font-size:60px}.case-intro{font-size:15px}.case-gallery{grid-template-columns:1fr}.case-actions a{width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){.case-gallery img{transition:none}.case-gallery figure:hover img{transform:none}}
</style>
</head>

<script src="script.js" defer></script>
<script>
const projects={
adhuri:{eyebrow:'04 — Writing / Novel',title:'अधूरी मोहब्बत',sub:'My First Novel',desc:'A long-form storytelling project where memory, relationships and unfinished emotions are shaped into a cinematic world of written words.',image:'adhuri-mohabbat-cover.jpg',tags:['Writing','Storytelling','Cinematic','Novel'],problem:'Some stories are too emotional to fit into a short caption or a single frame. This project began with the idea of giving an unfinished feeling enough space to become a complete world.',idea:'Turn emotion into narrative — then let the visual identity feel like a film before the first page is even read.',design:'A dark, restrained visual language with cinematic contrast, editorial typography and imagery built around absence, rain, memory and unfinished love.',creation:'The writing, title treatment and visual concepts were developed as one connected creative direction, so the words and visuals feel like parts of the same story.',result:'A distinct novel identity with a visual archive that can grow into covers, teasers, reels and future launch material.',quote:'Kitabon mein to sirf lafz hote hain... maine usmein zindagi likh di hai.',gallery:['adhuri-mohabbat-cover.jpg','adhuri-mohabbat-coming-soon.jpg','adhuri-mohabbat-rainy-street.jpg']},
anshan:{eyebrow:'05 — Music / Song',title:'ANSHAN',sub:'AI-Assisted Creative Music Project',desc:'An AI-assisted song and creative music project exploring voice, identity, protest and atmosphere. AI is the creative medium; the idea and expression remain the heart of ANSHAN.',image:'anshan-haq-le-kar-rahenge.jpg',tags:['Music / Song','AI-Assisted','Creative','Visuals'],problem:'A powerful song needs a visual language that can carry its mood and message beyond the audio itself. ANSHAN became a way to connect music, words and visual expression into one coherent creative project.',idea:'Build a recognisable identity around voice, resistance and atmosphere — using the song as the core and visual work as an extension of its world.',design:'Cinematic composition, dramatic typography, restrained palettes and recurring visual motifs create continuity across the music and its supporting visuals.',creation:'The song was developed as an AI-assisted creative music project, with AI used as a medium for creation and experimentation. The supporting visuals were then curated as part of the same artistic direction.',result:'A growing music-led creative project where sound, words and visuals reinforce one another without making AI the identity of the work.',quote:'Ek awaaz. Ek jung. Ek tasveer se aage — ek visual language.',gallery:['anshan-awaaz-nahi.jpg','anshan-haq-le-kar-rahenge.jpg','anshan-sach-ka-imtihaan.jpg','anshan-ek-awaaz-ek-jung.jpg','anshan-ek-taraf.jpg','anshan-justice-for-ladakh.jpg','anshan-awaaz-ko-koi-rokega-nahi.jpg']},
business:{eyebrow:'02 — Web / Landing Page',title:'Modern Business Website',sub:'Responsive Business Landing Page',desc:'A responsive business-style landing page created as a personal/demo project to explore frontend structure, visual hierarchy and practical UI presentation.',image:'assets/business-thumb.svg',tags:['Web Design','Frontend','UI','Responsive'],problem:'A business landing page has to communicate value quickly while remaining clear, credible and easy to navigate. This project explored how to organise that information without visual clutter.',idea:'Create a modern landing-page structure where hierarchy does the heavy lifting — clear sections, focused calls to action and a visual system that feels professional without becoming generic.',design:'A restrained editorial interface with strong typography, structured spacing, reusable content blocks and responsive behaviour keeps the page focused across screen sizes.',creation:'The page was built as a frontend/demo project using semantic HTML and CSS, with the layout and interaction choices shaped around a practical business presentation.',result:'A reusable business-website concept that demonstrates frontend structure, responsive thinking and visual communication in a compact landing-page format.',quote:'Good design should make the message easier to understand — not compete with it.',gallery:['assets/business-thumb.svg']},
portfolio:{eyebrow:'01 — Web / Portfolio',title:'Khurafaati Sameer',sub:'Personal Portfolio',desc:'A cinematic personal-brand website combining storytelling, writing, digital creativity and professional identity.',image:'sameer-portrait-web.jpg',tags:['HTML','CSS','JavaScript','Responsive'],problem:'A personal portfolio should communicate more than a list of skills. It should make the person, the work and the creative point of view feel connected.',idea:'Create a dark editorial home for the Khurafaati Sameer identity — part portfolio, part story, part creative archive.',design:'Charcoal surfaces, warm gold accents, editorial typography, generous spacing and subtle motion keep the interface premium without becoming noisy.',creation:'Built as a responsive static website with semantic HTML, custom CSS and lightweight JavaScript interactions.',result:'A live personal brand experience that gives web work, writing, visuals and professional identity one coherent home.',quote:'Doctor hona meri qualification hai. Writer hona meri awaaz. Creator hona meri aadat.',gallery:['sameer-portrait-web.jpg']}
};
function render(p){
 document.title=p.title+' — KHURAFAATI SAMEER';
 const imgs=p.gallery.map((x,i)=>'<figure><img src="'+x+'" alt="'+p.title+' visual '+(i+1)+'" loading="lazy" decoding="async"></figure>').join('');
 const archive=p===projects.adhuri?'visual-gallery.html#adhuri':p===projects.anshan?'visual-gallery.html#anshan':'projects.html';
 const archiveLabel=p===projects.adhuri||p===projects.anshan?'View full visual archive →':'Back to projects →';
 document.getElementById('app').innerHTML=
 '<section class="case-hero"><div class="case-wrap"><div class="case-kicker"><span>PERSONAL ARCHIVE / CASE STUDY</span><span>'+p.eyebrow+'</span></div><div class="case-grid"><div><p class="eyebrow">'+p.eyebrow+'</p><h1 class="case-title">'+p.title+'<em>'+p.sub+'</em></h1><p class="case-intro">'+p.desc+'</p><div class="case-meta">'+p.tags.map(t=>'<span class="case-pill">'+t+'</span>').join('')+'</div></div><figure class="case-image"><img src="'+p.image+'" alt="'+p.title+'" loading="eager" fetchpriority="high" decoding="async"><figcaption>PROJECT / '+p.title+'</figcaption></figure></div></div></section>'+
 '<section class="case-body"><article class="case-step"><div class="case-num">01 · Problem</div><div><h2>The starting point.</h2><p>'+p.problem+'</p></div></article><article class="case-step"><div class="case-num">02 · Idea</div><div><h2>The idea.</h2><p>'+p.idea+'</p><div class="case-quote">“'+p.quote+'”</div></div></article><article class="case-step"><div class="case-num">03 · Design</div><div><h2>The visual language.</h2><p>'+p.design+'</p></div></article><article class="case-step"><div class="case-num">04 · Creation</div><div><h2>Making it real.</h2><p>'+p.creation+'</p></div></article><article class="case-step"><div class="case-num">05 · Final Result</div><div><h2>What it became.</h2><p>'+p.result+'</p><div class="case-gallery">'+imgs+'</div><div class="case-actions"><a class="primary" href="'+archive+'">'+archiveLabel+' ↗</a><a href="projects.html">Back to projects ↗</a><a href="contact.html">Discuss a project ↗</a></div></div></article></section>';
}
const key=new URLSearchParams(location.search).get('project');
if(projects[key]) render(projects[key]);
else document.getElementById('app').innerHTML='<section class="case-not-found"><div><p class="eyebrow">PROJECT ARCHIVE</p><h1>Nothing here yet.</h1><a href="projects.html">← Back to projects</a></div></section>';
</script>
