<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search Khurafaati Sameer articles by title, topic, category or tag.">
<meta name="theme-color" content="#641F2B">
<link rel="canonical" href="https://khurafaati-sameer.github.io/search/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="../logo-transparent.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<meta name="robots" content="noindex,follow">
<title>Search — KHURAFAATI SAMEER</title>

<style>
:root{
  --bg:#F4F0E7;--paper:#FAF7F0;--card:#ECE3D4;--card-2:#E7DDCE;
  --ink:#171513;--muted:#655F56;--soft:#8A8175;--line:rgba(55,43,29,.16);
  --line-strong:rgba(55,43,29,.28);--burgundy:#641F2B;--burgundy-2:#7A2A37;
  --max:1240px;--gutter:clamp(18px,4vw,48px);
  --sans:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.58;-webkit-font-smoothing:antialiased}
body.menu-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--burgundy);outline-offset:4px
}
::selection{background:var(--burgundy);color:#fff}
.skip-link{position:fixed;left:16px;top:14px;z-index:1000;background:var(--ink);color:#fff;padding:11px 15px;transform:translateY(-150%);transition:transform .2s}
.skip-link:focus{transform:none}
.site-shell{width:min(var(--max),calc(100% - var(--gutter)*2));margin-inline:auto}
.site-header{min-height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:30px}
.brand{font-size:12px;font-weight:700;letter-spacing:.17em}
.brand span{color:var(--burgundy)}
.main-nav{display:flex;align-items:center;gap:28px}
.main-nav a{font-size:12px;color:var(--muted);position:relative;padding:10px 0}
.main-nav a::after{content:"";position:absolute;left:0;right:100%;bottom:4px;height:1px;background:var(--burgundy);transition:right .2s}
.main-nav a:hover,.main-nav a[aria-current="page"]{color:var(--ink)}
.main-nav a:hover::after,.main-nav a[aria-current="page"]::after{right:0}
.menu-toggle{display:none;width:46px;height:46px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.hero{padding:clamp(76px,10vw,132px) 0 52px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--burgundy);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--burgundy)}
.hero h1{font-size:clamp(58px,8.2vw,112px);line-height:.88;letter-spacing:-.07em;margin:20px 0 18px;font-weight:700}
.hero p{max-width:650px;color:var(--muted);font-size:16px;margin:0;line-height:1.65}
.search-panel{margin-top:26px}
.search-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.search-field{position:relative}
.search-field svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--soft);pointer-events:none}
.search-input{width:100%;height:52px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:0 48px;font-size:15px}
.search-input::placeholder{color:#958B7D}
.clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);display:none}
.clear-search.visible{display:block}
.search-button{min-width:120px;height:52px;border:1px solid var(--burgundy);background:var(--burgundy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,transform .2s}
.search-button:hover{background:var(--burgundy-2);transform:translateY(-1px)}
.search-help{margin-top:10px;color:var(--soft);font-size:12px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:30px 0 16px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;min-height:44px;padding:9px 14px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.filter:hover{border-color:var(--burgundy);color:var(--burgundy)}
.filter.active{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.sort-wrap{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sort-label{font-size:11px;color:var(--soft);white-space:nowrap}
.sort-select{height:44px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:0 34px 0 12px;font-size:12px}
.result-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 18px;color:var(--soft);font-size:12px}
.result-bar strong{color:var(--ink);font-weight:600}
.featured{margin:0 0 54px}
.featured-link{display:grid;grid-template-columns:minmax(0,.92fr) minmax(360px,1.08fr);min-height:420px;background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.featured-link:hover,.featured-link:focus-visible{transform:translateY(-4px);box-shadow:0 18px 45px rgba(55,43,29,.10);border-color:var(--line-strong)}
.featured-visual{min-height:420px;position:relative;background:#171513;overflow:hidden;display:flex;align-items:flex-end;padding:30px}
.featured-visual::before{content:"";position:absolute;width:58%;aspect-ratio:1;right:-10%;top:-16%;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 38px rgba(255,255,255,.025),0 0 0 76px rgba(255,255,255,.018)}
.featured-visual::after{content:"";position:absolute;left:12%;top:16%;width:34%;height:66%;background:var(--burgundy);opacity:.85;transform:skewY(-8deg) rotate(-4deg)}
.visual-copy{position:relative;z-index:2;color:#fff}
.visual-index{font-size:12px;letter-spacing:.2em;color:#D7AEB4}
.visual-title{font-size:clamp(52px,6vw,82px);line-height:.82;letter-spacing:-.07em;margin-top:12px}
.visual-title em{display:block;font:400 .58em/1 var(--serif);letter-spacing:0;color:#D8D0C6;margin-top:10px}
.featured-copy{padding:clamp(30px,4vw,56px);display:flex;flex-direction:column;justify-content:center}
.featured-copy .cat{font-size:11px;color:var(--burgundy);font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.featured-copy h2{font-size:clamp(30px,4vw,50px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 15px}
.featured-copy p{font-size:15px;color:var(--muted);line-height:1.7;max-width:610px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 9px;background:rgba(250,247,240,.45)}
.featured-meta{display:flex;gap:15px;flex-wrap:wrap;margin-top:22px;color:var(--soft);font-size:12px}
.featured-cta{margin-top:25px;color:var(--burgundy);font-size:12px;font-weight:700;letter-spacing:.08em}
.arrow{display:inline-block;transition:transform .2s}
.featured-link:hover .arrow,.featured-link:focus-visible .arrow{transform:translateX(5px)}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.article-card{min-height:355px;background:var(--card);display:flex;flex-direction:column;padding:28px;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s;position:relative}
.article-card:hover,.article-card:focus-visible{background:var(--card-2);transform:translateY(-3px);box-shadow:0 16px 35px rgba(55,43,29,.08);z-index:2}
.article-card .cat{font-size:10px;color:var(--burgundy);font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.article-card h2{font-size:23px;line-height:1.12;letter-spacing:-.035em;margin:20px 0 11px;transition:color .2s}
.article-card:hover h2,.article-card:focus-visible h2{color:var(--burgundy)}
.article-card p{font-size:15px;color:var(--muted);line-height:1.62;margin:0}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.card-tags .tag{font-size:10px;padding:4px 7px}
.card-meta{margin-top:16px;color:var(--soft);font-size:12px}
.card-read{margin-top:auto;padding-top:24px;color:var(--burgundy);font-size:11px;font-weight:700;letter-spacing:.1em}
.article-card .arrow{margin-left:3px}
.article-card:hover .arrow,.article-card:focus-visible .arrow{transform:translateX(5px)}
.empty-state{padding:58px 28px;border:1px dashed var(--line-strong);background:var(--paper);text-align:center}
.empty-state h2{font:400 clamp(30px,4vw,44px)/1.1 var(--serif);margin:0}
.empty-state p{color:var(--muted);font-size:15px;margin:12px auto 22px;max-width:520px}
.empty-state button{min-height:46px;padding:10px 17px;border:1px solid var(--burgundy);background:var(--burgundy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}


<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="site-shell">
<header class="site-header">
  <a class="brand" href="../index.html" aria-label="Khurafaati Sameer home">KHURAFAATI <span>SAMEER</span></a>
  <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="primaryNav" aria-label="Open navigation">☰</button>
  <nav class="main-nav" id="primaryNav" aria-label="Primary navigation">
    <a href="../articles/index.html" aria-current="page">Articles</a>
    <a href="../author/index.html">About</a>
  </nav>
</header>

<main id="main">
  <section class="hero" aria-labelledby="pageTitle">
    <span class="eyebrow">Search</span>
    <h1 id="pageTitle">Find a story.</h1>
    <p>Search across every published article, category and tag.</p>

    <div class="search-panel">
      <form class="search-row" id="searchForm" role="search">
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <label class="hidden" for="searchInput">Search articles</label>
          <input class="search-input" id="searchInput" name="q" type="search" placeholder="Search articles, categories, or tags…" autocomplete="off" enterkeyhint="search">
          <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search">×</button>
        </div>
        <button class="search-button" type="submit">Search</button>
      </form>
      <div class="search-help">Try: Instagram, relationships, money, career, growth…</div>
    </div>
  </section>

  <section aria-labelledby="resultsHeading">
    <div class="controls">
      <div class="filters" id="filters" role="group" aria-label="Filter by category">
        <button class="filter active" type="button" data-category="All" aria-pressed="true">All</button>
        <button class="filter" type="button" data-category="Tech & Social Media" aria-pressed="false">Tech &amp; Social Media</button>
        <button class="filter" type="button" data-category="Relationships" aria-pressed="false">Relationships</button>
        <button class="filter" type="button" data-category="Money & Career" aria-pressed="false">Money &amp; Career</button>
      </div>
      <div class="sort-wrap">
        <label class="sort-label" for="sortSelect">Sort</label>
        <select class="sort-select" id="sortSelect">
          <option value="latest">Latest</option>
          <option value="popular">Most Popular</option>
          <option value="short">Short Read</option>
          <option value="long">Long Read</option>
        </select>
      </div>
    </div>

    <div class="result-bar">
      <span id="resultsHeading"><strong id="resultCount">3</strong> stories available</span>
      <span id="filterSummary">All articles</span>
    </div>

    <div class="featured" id="featured"></div>
    <div class="results-grid" id="resultsGrid" aria-live="polite" aria-label="Article results"></div>

    <div class="empty-state hidden" id="emptyState" role="status">
      <h2 id="emptyTitle">No stories found.</h2>
      <p>Try another topic, category, or browse all articles.</p>
      <button id="emptyClear" type="button">Clear search</button>
    </div>
  </section>


</main>

<footer class="site-footer">
  <div>
    <div class="footer-brand">KHURAFAATI SAMEER</div>
    <div class="footer-tagline">Real stories. Raw feelings. Digital creations.</div>
  </div>
  <nav class="footer-links" aria-label="Footer navigation">
    <a href="../articles/index.html">Articles</a>
    <a href="../author/index.html">About</a>
    <a href="../contact.html">Contact</a>
    <a href="../privacy.html">Privacy Policy</a>
  </nav>
  <div class="footer-socials" aria-label="Social links">
    <a href="https://www.instagram.com/khurafaati_sameer/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">IG</a>
    
  </div>
  <div class="copyright">© 2026 Khurafaati Sameer. All rights reserved.</div>
</footer>
</div>

<script>
(() => {
  const articles = [
    {
      title:"Instagram Algorithm Explained: What Actually Matters in 2026",
      description:"Watch time, shares, saves, originality and audience signals can help you improve your Instagram reach.",
      category:"Tech & Social Media",
      tags:["Instagram","Growth"],
      date:"19 Aug 2026", time:"2026-08-19", minutes:6,
      url:"../articles/instagram-algorithm-2026/index.html",
      popularity:3
    },
    {
      title:"20 Signs Someone May Be Interested in You",
      description:"Learn 20 practical signs that may suggest someone is genuinely interested in you.",
      category:"Relationships",
      tags:["Dating","Relationships"],
      date:"18 Aug 2026", time:"2026-08-18", minutes:5,
      url:"../articles/relationships-signs/index.html",
      popularity:2
    },
    {
      title:"Side Hustles You Can Start with Low Upfront Cost in India",
      description:"Explore low-investment side hustles that beginners in India can start practically.",
      category:"Money & Career",
      tags:["Income","Business"],
      date:"17 Aug 2026", time:"2026-08-17", minutes:6,
      url:"../articles/zero-investment-side-hustles/index.html",
      popularity:1
    }
  ];

  const state = {query:"", category:"All", sort:"latest"};
  const form = document.getElementById("searchForm");
  const input = document.getElementById("searchInput");
  const clear = document.getElementById("clearSearch");
  const filters = [...document.querySelectorAll(".filter")];
  const sort = document.getElementById("sortSelect");
  const featured = document.getElementById("featured");
  const grid = document.getElementById("resultsGrid");
  const empty = document.getElementById("emptyState");
  const emptyTitle = document.getElementById("emptyTitle");
  const emptyClear = document.getElementById("emptyClear");
  const count = document.getElementById("resultCount");
  const summary = document.getElementById("filterSummary");
  const newsletterForm = document.getElementById("newsletterForm");
  const formMessage = document.getElementById("formMessage");
  const menuToggle = document.getElementById("menuToggle");
  const nav = document.getElementById("primaryNav");

  const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));

  function sortArticles(list){
    const copy=[...list];
    if(state.sort==="latest") return copy.sort((a,b)=>b.time.localeCompare(a.time));
    if(state.sort==="popular") return copy.sort((a,b)=>b.popularity-a.popularity);
    if(state.sort==="short") return copy.sort((a,b)=>a.minutes-b.minutes || b.time.localeCompare(a.time));
    if(state.sort==="long") return copy.sort((a,b)=>b.minutes-a.minutes || b.time.localeCompare(a.time));
    return copy;
  }

  function matches(article){
    const q=state.query.toLowerCase().trim();
    const categoryOK=state.category==="All" || article.category===state.category;
    if(!categoryOK) return false;
    if(!q) return true;
    return (article.title+" "+article.description+" "+article.category+" "+article.tags.join(" "))
      .toLowerCase().includes(q);
  }

  function featuredMarkup(article){
    return `
      <a class="featured-link" href="${article.url}" aria-label="Read featured story: ${escapeHTML(article.title)}">
        <div class="featured-visual" aria-hidden="true">
          <div class="visual-copy">
            <div class="visual-index">01 / FEATURED</div>
            <div class="visual-title">REACH<em>what actually matters.</em></div>
          </div>
        </div>
        <div class="featured-copy">
          <div class="cat">${escapeHTML(article.category)}</div>
          <h2>${escapeHTML(article.title)}</h2>
          <p>${escapeHTML(article.description)}</p>
          <div class="tag-list">${article.tags.map(tag=>`<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          <div class="featured-meta"><span>${escapeHTML(article.date)}</span><span>•</span><span>${article.minutes} min read</span></div>
          <div class="featured-cta">Read featured story <span class="arrow">→</span></div>
        </div>
      </a>`;
  }

  function cardMarkup(article){
    return `
      <a class="article-card" href="${article.url}" aria-label="Read: ${escapeHTML(article.title)}">
        <div class="cat">${escapeHTML(article.category)}</div>
        <h2>${escapeHTML(article.title)}</h2>
        <p>${escapeHTML(article.description)}</p>
        <div class="card-tags">${article.tags.map(tag=>`<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
        <div class="card-meta">${escapeHTML(article.date)} <span aria-hidden="true">•</span> ${article.minutes} min read</div>
        <div class="card-read">Read article <span class="arrow">→</span></div>
      </a>`;
  }

  function render(){
    const filtered=sortArticles(articles.filter(matches));
    const activeCategory=state.category==="All" ? "All articles" : state.category;
    count.textContent=filtered.length;
    summary.textContent=state.query
      ? `${activeCategory} · “${state.query}”`
      : activeCategory;
    clear.classList.toggle("visible",Boolean(input.value));

    const featuredArticle=filtered.find(a=>a.title.startsWith("Instagram Algorithm")) || null;
    const rest=filtered.filter(a=>a!==featuredArticle);

    featured.innerHTML=featuredArticle && !state.query && state.category==="All"
      ? featuredMarkup(featuredArticle) : "";

    grid.innerHTML=rest.map(cardMarkup).join("");

    if(!filtered.length){
      featured.innerHTML="";
      grid.innerHTML="";
      empty.classList.remove("hidden");
      emptyTitle.textContent=state.query
        ? `No stories found for “${state.query}”.`
        : `No stories found for “${state.category}”.`;
    }else{
      empty.classList.add("hidden");
    }

    const params=new URLSearchParams();
    if(state.query) params.set("q",state.query);
    if(state.category!=="All") params.set("category",state.category);
    if(state.sort!=="latest") params.set("sort",state.sort);
    const next=params.toString();
    history.replaceState({}, "", next ? `./?${next}` : "./");
  }

  form.addEventListener("submit",event=>{
    event.preventDefault();
    state.query=input.value.trim();
    render();
  });

  input.addEventListener("input",()=>{
    state.query=input.value.trim();
    render();
  });

  clear.addEventListener("click",()=>{
    input.value="";
    state.query="";
    input.focus();
    render();
  });

  filters.forEach(button=>{
    button.addEventListener("click",()=>{
      state.category=button.dataset.category;
      filters.forEach(item=>{
        const active=item===button;
        item.classList.toggle("active",active);
        item.setAttribute("aria-pressed",String(active));
      });
      render();
    });
  });

  sort.addEventListener("change",()=>{
    state.sort=sort.value;
    render();
  });

  emptyClear.addEventListener("click",()=>{
    input.value="";
    state.query="";
    state.category="All";
    state.sort="latest";
    sort.value="latest";
    filters.forEach(item=>{
      const active=item.dataset.category==="All";
      item.classList.toggle("active",active);
      item.setAttribute("aria-pressed",String(active));
    });
    render();
    input.focus();
  });



  menuToggle.addEventListener("click",()=>{
    const open=nav.classList.toggle("open");
    menuToggle.setAttribute("aria-expanded",String(open));
    menuToggle.setAttribute("aria-label",open ? "Close navigation" : "Open navigation");
    document.body.classList.toggle("menu-open",open);
  });

  nav.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>{
    nav.classList.remove("open");
    menuToggle.setAttribute("aria-expanded","false");
    menuToggle.setAttribute("aria-label","Open navigation");
    document.body.classList.remove("menu-open");
  }));

  const params=new URLSearchParams(location.search);
  state.query=params.get("q")||"";
  state.category=params.get("category")||"All";
  state.sort=params.get("sort")||"latest";
  if(!filters.some(f=>f.dataset.category===state.category)) state.category="All";
  if(!["latest","popular","short","long"].includes(state.sort)) state.sort="latest";
  input.value=state.query;
  sort.value=state.sort;
  filters.forEach(item=>{
    const active=item.dataset.category===state.category;
    item.classList.toggle("active",active);
    item.setAttribute("aria-pressed",String(active));
  });
  render();
})();
</script>
</body>
</html>
