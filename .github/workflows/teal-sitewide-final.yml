name: Finalize cinematic teal palette sitewide

on:
  push:
    paths:
      - '.github/workflows/teal-sitewide-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final teal palette to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              '#080808':'#0B1214', '#0b0b0b':'#0B1214', '#0d0d0d':'#101D20', '#101010':'#101D20',
              '#111111':'#112125', '#121212':'#112125', '#151515':'#152A2D', '#19150f':'#102327',
              '#f4f1eb':'#F2F4F1', '#f4f1ea':'#F2F4F1', '#f5f2ed':'#F2F4F1', '#f4f4f4':'#F2F4F1',
              '#d9a441':'#2DD4C8', '#D9A441':'#2DD4C8', '#e0b04f':'#2DD4C8', '#c99a38':'#2DD4C8',
              '#b8862d':'#2DD4C8', '#c49a45':'#2DD4C8', '#d4a84f':'#2DD4C8', '#d4a64a':'#2DD4C8',
              '#aaa':'#A5B4B5', '#999':'#9AA9AA', '#888':'#849596', '#777':'#748586', '#666':'#708384',
              '#555':'#617779', '#444':'#52696B', '#eee':'#E4ECEA', '#ddd':'#D8E3E0', '#ccc':'#C9D4D2',
              '#918d86':'#8FA2A3', '#89857f':'#87999A', '#5d5a55':'#607779',
              'rgba(217,164,65,.45)':'rgba(45,212,200,.45)',
              'rgba(217,164,65,.38)':'rgba(45,212,200,.38)',
              'rgba(217,164,65,.25)':'rgba(45,212,200,.25)',
              'rgba(217,164,65,.12)':'rgba(45,212,200,.12)',
              'rgba(217,164,65,.68)':'rgba(11,18,20,.68)',
              'rgba(217,164,65,.9)':'rgba(11,18,20,.9)',
              'rgba(8,8,8,.86)':'rgba(11,18,20,.86)',
              'rgba(8,8,8,.9)':'rgba(11,18,20,.9)',
              'radial-gradient(circle at 50% 40%,#19150f,#0B1214 65%)':'radial-gradient(circle at 50% 40%,#18363A,#0B1214 65%)',
          }
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              for a,b in replacements.items():
                  s=s.replace(a,b)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated', len(changed), 'HTML files')
          for x in changed: print(x)
          PY
      - name: Commit sitewide palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML palette changes needed.'
            exit 0
          fi
          git commit -m 'Finalize cinematic teal palette sitewide'
          git push
