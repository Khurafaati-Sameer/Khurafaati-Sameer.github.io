name: P5.2-C Finalize Book Link
on:
  push:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect homepage novel section
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker=s.rfind('अधूरी मोहब्बत')
          if marker<0: raise SystemExit('Novel marker not found')
          print('--- NOVEL CONTEXT START ---')
          print(s[max(0,marker-2500):marker+7500])
          print('--- NOVEL CONTEXT END ---')
          PY
