name: P5.2-C Finalize Book Link
on:
  push:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link homepage novel section to dedicated book page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='author/books/adhuri-mohabbat/'
          if new in s:
              print('Homepage already points to dedicated book page')
          else:
              start=s.find('<section id="novel">')
              end=s.find('</section>', start)
              if start<0 or end<0:
                  raise SystemExit('Homepage novel section not found')
              section=s[start:end]
              old='href="https://youtube.com/@mohdsameeraalam"'
              if old not in section:
                  raise SystemExit('Expected novel CTA destination not found inside novel section')
              section=section.replace(old, f'href="{new}"', 1)
              s=s[:start]+section+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Homepage novel CTA now points to dedicated book page')
          PY
      - name: Verify P5.2-C integration
        run: |
          test -f author/books/adhuri-mohabbat/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.find('<section id="novel">')
          end=s.find('</section>', start)
          section=s[start:end]
          assert 'href="author/books/adhuri-mohabbat/"' in section
          assert 'href="https://youtube.com/@mohdsameeraalam"' not in section
          print('P5.2-C homepage integration verified')
          PY
          grep -q 'canonical' author/books/adhuri-mohabbat/index.html
          echo 'Dedicated book page verified'
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Link homepage novel section to dedicated book page'
          git rm -f p52c-finalize-trigger.txt .github/workflows/p52c-finalize.yml
          git commit -m 'Remove one-time P5.2-C finalization workflow'
          git push
