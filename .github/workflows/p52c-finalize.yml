name: P5.2-C Finalize Book Link
on:
  push:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage book destination
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='author/books/adhuri-mohabbat/'
          if new in s:
              print('Homepage already points to dedicated book page')
          else:
              markers=['अधूरी मोहब्बत','अधूरी','My First Novel','MOHABBAT']
              marker=-1
              used=''
              for m in markers:
                  marker=s.rfind(m)
                  if marker>=0:
                      used=m
                      break
              if marker < 0:
                  raise SystemExit('Novel marker not found on homepage')
              start=s.rfind('href="',0,marker)
              end=s.find('"',start+6) if start>=0 else -1
              if start < 0 or end < 0:
                  raise SystemExit(f'No nearby href found for novel marker: {used}')
              href_start=start+6
              old=s[href_start:end]
              if 'project-case-study' not in old and 'case-study' not in old:
                  raise SystemExit(f'Unexpected novel href near {used}: {old}')
              s=s[:href_start]+new+s[end:]
              p.write_text(s,encoding='utf-8')
              print(f'Updated homepage book href: {old} -> {new}')
          PY
      - name: Verify P5.2-C integration
        run: |
          test -f author/books/adhuri-mohabbat/index.html
          grep -q 'author/books/adhuri-mohabbat/' index.html
          grep -q 'canonical' author/books/adhuri-mohabbat/index.html
          echo 'P5.2-C integration verification passed'
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Link homepage novel section to dedicated book page'
          fi
          git rm -f p52c-finalize-trigger.txt .github/workflows/p52c-finalize.yml
          git commit -m 'Remove one-time P5.2-C finalization workflow'
          git push
