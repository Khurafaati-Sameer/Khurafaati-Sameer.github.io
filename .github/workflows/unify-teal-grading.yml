name: Unify cinematic teal grading

on:
  push:
    paths:
      - '.github/workflows/unify-teal-grading.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified grading to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          css = r'''<style id="unified-teal-grading">
          :root{--bg:#0F1E23;--panel:#1B343A;--surface:#2A4E57;--surface-2:#4F7D87;--text:#F1F5F4;--muted:#A7BEC0;--line:rgba(177,226,229,.18);--accent:#2DD4C8}
          html{background:#0F1E23}
          body{background:radial-gradient(circle at 82% 8%,rgba(45,212,200,.10),transparent 30%),linear-gradient(145deg,#0F1E23 0%,#10272D 48%,#0F1E23 100%)!important;color:var(--text)!important}
          header{background:rgba(15,30,35,.82)!important;border-color:var(--line)!important}
          main,section,.wrap{background:transparent}
          .project,.card,.article,.related-card,.credential,.connect-box,.visual-card,.gallery-card,.search-card,.panel,.browse,.filter,.pill,.tag,.paths>div{background-color:rgba(27,52,58,.88)!important;border-color:var(--line)!important}
          .project:hover,.card:hover,.article:hover,.related-card:hover,.visual-card:hover,.gallery-card:hover{border-color:rgba(45,212,200,.55)!important}
          .project h2,.card h2,.article h1,.article h2,.article h3,.related h2,.search h1,.hero h1,.section-title,.head h2{color:var(--text)!important}
          p,.lead,.copy,.desc,.meta,.project p,.article p,.connect-box p,.professional p,.credential p{color:var(--muted)!important}
          .eyebrow,.label,.cat,.type,.section-label,.kicker,.browse-title,.related-kicker,.mini,.read span,.project-link span,.logo span,.global-footer-nav a:hover{color:var(--accent)!important}
          a:hover{color:var(--accent)!important}
          button,.btn,.filter.active{background:var(--accent)!important;color:#082024!important;border-color:var(--accent)!important}
          input,textarea,select{background:#152D33!important;color:var(--text)!important;border-color:var(--line)!important}
          input::placeholder,textarea::placeholder{color:#789296!important}
          footer{background:rgba(10,27,32,.72)!important;border-color:var(--line)!important;color:#789296!important}
          .hero:before,.hero:after{background:rgba(45,212,200,.10)!important}
          .overlay{background:linear-gradient(180deg,transparent,rgba(7,24,29,.78))!important}
          .manifesto{color:var(--text)!important;border-color:var(--accent)!important}
          .quote{border-color:var(--accent)!important;color:var(--text)!important}
          ::selection{background:rgba(45,212,200,.30);color:#fff}
          @media(max-width:560px){body{background:linear-gradient(160deg,#0F1E23,#122B31 55%,#0F1E23)!important}}
          </style>'''
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              marker='id="unified-teal-grading"'
              if marker in s: continue
              if '</head>' in s:
                  s=s.replace('</head>',css+'</head>',1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit grading update and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '.github/workflows/unify-teal-grading.yml'
          git commit -m "Unify cinematic teal grading across website"
          git rm '.github/workflows/unify-teal-grading.yml'
          git commit -m "Remove one-time teal grading workflow"
          git push
