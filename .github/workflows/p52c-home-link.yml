name: P5.2 Home Book Link
on:
  push:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link homepage novel section to book page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='project-case-study.html?project=adhuri'
          new='author/books/adhuri-mohabbat/'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
              print('Updated homepage novel destination')
          elif new in s:
              print('Homepage already points to dedicated book page')
          else:
              raise SystemExit('Neither expected old nor new homepage book link found')
          PY
      - name: Verify homepage destination and book page
        run: |
          test -f author/books/adhuri-mohabbat/index.html
          grep -o 'author/books/adhuri-mohabbat/' index.html | head -n 1
          test "$(grep -o 'author/books/adhuri-mohabbat/' index.html | wc -l)" -ge 1
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change needed'
          else
            git commit -m 'Link homepage novel section to dedicated book page'
          fi
          git rm .github/workflows/p52c-home-link.yml
          git commit -m 'Remove one-time P5.2 home link workflow'
          git push