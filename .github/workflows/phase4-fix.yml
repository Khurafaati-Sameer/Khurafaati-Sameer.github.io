name: Phase 4 CSS Correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct CSS import ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}.skip-link:focus{position:fixed;left:18px;top:18px;width:auto;height:auto;z-index:100;padding:10px 14px;background:#f2eee6;color:#090909;outline:2px solid var(--accent)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.menu{cursor:pointer}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.article,.visual-card img{transition:none}}'
          prefix = '<style>' + css + '@import url'
          if prefix in s:
              s = s.replace(prefix, '<style>@import url', 1)
              s = s.replace("display=swap');:root", "display=swap');" + css + ":root", 1)
          elif '<style>@import url' not in s:
              raise SystemExit('Expected stylesheet marker not found')
          p.write_text(s, encoding='utf-8')
      - name: Verify Phase 4 homepage pass
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'aria-controls="mobile"',
              'aria-label="Mobile navigation"',
              'href="#main-content"',
              'loading="eager" fetchpriority="high" decoding="async"',
              'loading="lazy" decoding="async"',
              'a:focus-visible,button:focus-visible',
              '@media(prefers-reduced-motion:reduce)',
              '<style>@import url'
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Verification failed: ' + ', '.join(missing))
      - name: Commit and remove one-time workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Phase 4 homepage accessibility pass [phase4-fix]"
          git rm -f .github/workflows/phase4-fix.yml .github/workflows/phase4-a11y.yml || true
          git commit -m "Remove one-time Phase 4 workflows [phase4-fix]" || true
          git push
