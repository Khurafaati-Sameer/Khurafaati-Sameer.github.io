name: Prepare Transparent Brand Logo

on:
  push:
    paths:
      - 'logo.png'
      - '.github/workflows/make-logo-transparent.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create transparent logo
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque

          src = Image.open('logo.png').convert('RGBA')
          px = src.load()
          w, h = src.size
          q = deque()
          seen = bytearray(w * h)

          def near_black(r, g, b):
              return r < 42 and g < 42 and b < 42

          for x in range(w):
              q.append((x, 0)); q.append((x, h - 1))
          for y in range(h):
              q.append((0, y)); q.append((w - 1, y))

          while q:
              x, y = q.popleft()
              i = y * w + x
              if seen[i]:
                  continue
              seen[i] = 1
              r, g, b, a = px[x, y]
              if not near_black(r, g, b):
                  continue
              px[x, y] = (r, g, b, 0)
              if x > 0: q.append((x - 1, y))
              if x + 1 < w: q.append((x + 1, y))
              if y > 0: q.append((x, y - 1))
              if y + 1 < h: q.append((x, y + 1))

          src.save('logo-transparent.png', 'PNG', optimize=True)
          PY

      - name: Switch site branding to transparent logo
        run: |
          find . -type f \( -name '*.html' -o -name '*.css' \) -print0 | xargs -0 sed -i 's/logo\.png/logo-transparent.png/g'

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-transparent.png
          git add -u
          git commit -m "Use transparent official brand logo"
          git rm .github/workflows/make-logo-transparent.yml
          git commit -m "Remove one-time logo preparation workflow"
          git push
