name: Apply Warm Ivory Theme

on:
  push:
    paths:
      - 'ivory-theme.css'
      - '.github/workflows/apply-ivory-theme.yml'
      - 'ivory-theme-trigger.txt'

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply theme to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          link = '<link rel="stylesheet" href="/ivory-theme.css">'
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              s = path.read_text(encoding='utf-8')
              if '/ivory-theme.css' not in s:
                  if '</head>' in s:
                      s = s.replace('</head>', link + '</head>', 1)
                  else:
                      continue
              s = s.replace('content="#0E1A1C"', 'content="#F3EEE4"')
              s = s.replace('content="#0B1214"', 'content="#F3EEE4"')
              path.write_text(s, encoding='utf-8')
          PY

      - name: Verify rollout
        run: |
          test -f ivory-theme.css
          test -n "$(grep -RIl '/ivory-theme.css' --include='*.html' . | head -1)"
          grep -q '#F3EEE4' index.html
          grep -q '#A56D24' ivory-theme.css

      - name: Commit theme rollout and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' ivory-theme.css
          git add -u
          git diff --cached --quiet || git commit -m "Apply warm ivory editorial theme"
          git rm .github/workflows/apply-ivory-theme.yml ivory-theme-trigger.txt
          git commit -m "Remove one-time ivory theme workflow"
          git push
