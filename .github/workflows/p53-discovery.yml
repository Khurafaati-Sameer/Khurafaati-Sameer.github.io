name: P5.3 Content Discovery Audit
on:
  push:
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discovery links to category and tag hubs
        run: |
          python - <<'PY'
          from pathlib import Path
          category_links='''<div class="discovery"><div class="discovery-title">Explore More Writing</div><div class="discovery-links"><a href="../../articles/index.html">All Writing</a><a href="../../category/relationships/">Relationships</a><a href="../../category/money-and-career/">Money &amp; Career</a><a href="../../category/tech-and-social-media/">Tech &amp; Social Media</a><a href="../../search/">Search Writing</a></div></div>'''
          tag_links='''<div class="discovery"><div class="discovery-title">Explore More Writing</div><div class="discovery-links"><a href="../../articles/index.html">All Writing</a><a href="../../category/relationships/">Relationships</a><a href="../../category/money-and-career/">Money &amp; Career</a><a href="../../category/tech-and-social-media/">Tech &amp; Social Media</a><a href="../../search/">Search Writing</a></div></div>'''
          css='''.discovery{margin-top:35px;padding-top:22px;border-top:1px solid var(--line)}.discovery-title{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#666;margin-bottom:12px}.discovery-links{display:flex;gap:10px;flex-wrap:wrap}.discovery-links a{border:1px solid var(--line);padding:7px 10px;color:#999;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.discovery-links a:hover{border-color:var(--accent);color:#fff}.discovery-links a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:560px){.discovery-links{gap:7px}.discovery-links a{font-size:8px;padding:6px 8px}}'''
          for p in list(Path('category').glob('*/index.html')) + list(Path('tag').glob('*/index.html')):
              s=p.read_text(encoding='utf-8')
              if 'class="discovery"' in s:
                  continue
              marker='<footer>'
              if marker not in s:
                  raise SystemExit(f'Footer not found: {p}')
              s=s.replace('</style></head>',css+'</style></head>',1)
              s=s.replace(marker,category_links+marker,1)
              p.write_text(s,encoding='utf-8')
              print('Updated',p)
          PY
      - name: Verify discovery architecture
        run: |
          test "$(find category -name index.html | wc -l)" -eq 3
          test "$(find tag -name index.html | wc -l)" -eq 11
          test "$(grep -Rl 'class=\"discovery\"' category tag | wc -l)" -eq 14
          grep -R 'All Writing' category tag >/dev/null
          grep -R 'Search Writing' category tag >/dev/null
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add category tag
          if ! git diff --cached --quiet; then
            git commit -m 'Improve category and tag content discovery'
          fi
          git rm -f .github/workflows/p53-discovery.yml
          git commit -m 'Remove one-time P5.3 discovery workflow'
          git push
