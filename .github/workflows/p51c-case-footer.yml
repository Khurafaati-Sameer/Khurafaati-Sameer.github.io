name: P5.1-C Case Study Footer Audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[p51c]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize case study footer navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-case-study.html')
          s=p.read_text(encoding='utf-8')
          if 'class="global-footer-nav"' in s:
              raise SystemExit('Global footer nav already present')
          css='.global-footer-nav{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px}.global-footer-nav a{color:#777;font-size:9px;letter-spacing:.13em}.global-footer-nav a:hover{color:#fff}'
          s=s.replace('</style>',css+'</style>',1)
          nav='<div class="global-footer-nav"><a href="index.html">Home</a><a href="articles/index.html">Writing</a><a href="projects.html">Work</a><a href="search/">Search</a></div>'
          s=s.replace('KHURAFAATI SAMEER · Real stories. Raw feelings. Digital creations.</footer>', 'KHURAFAATI SAMEER · Real stories. Raw feelings. Digital creations.'+nav+'</footer>',1)
          if 'class="global-footer-nav"' not in s:
              raise SystemExit('Footer replacement failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact navigation targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('project-case-study.html').read_text(encoding='utf-8')
          for href in ['index.html','articles/index.html','projects.html','search/']:
              if f'href="{href}"' not in s:
                  raise SystemExit(f'Missing {href}')
          if s.count('class="global-footer-nav"') != 1:
              raise SystemExit('Global footer nav count is not 1')
          print('P5.1-C case study footer verification passed.')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-case-study.html .github/workflows/p51c-case-footer.yml
          git commit -m 'Standardize case study global navigation [p51c]'
          git push
          git rm .github/workflows/p51c-case-footer.yml
          git commit -m 'Remove one-time case footer workflow [p51c]'
          git push
