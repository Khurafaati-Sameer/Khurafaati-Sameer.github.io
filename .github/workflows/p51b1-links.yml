name: P5.1-B.1 Article Cross Links

on:
  push:
    paths:
      - '.github/workflows/p51b1-links.yml'

permissions:
  contents: write

jobs:
  cross-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add article cross-links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('articles')
          articles = {
              'instagram-algorithm-2026': {
                  'title': 'Instagram Algorithm Explained: What Actually Matters in 2026',
                  'category': 'Tech & Social Media',
                  'category_href': '../../category/tech-and-social-media/',
                  'tags': [('Instagram','../../tag/instagram/'),('Social Media','../../tag/social-media/'),('Reels','../../tag/reels/'),('Content Creation','../../tag/content-creation/')],
                  'related': [('20 Signs Someone May Be Interested in You','../relationships-signs/','Relationships'),('Side Hustles You Can Start with Low Upfront Cost in India','../zero-investment-side-hustles/','Money & Career')]
              },
              'relationships-signs': {
                  'title': '20 Signs Someone May Be Interested in You',
                  'category': 'Relationships',
                  'category_href': '../../category/relationships/',
                  'tags': [('Relationships','../../tag/relationships/'),('Psychology','../../tag/psychology/'),('Communication','../../tag/communication/')],
                  'related': [('Instagram Algorithm Explained: What Actually Matters in 2026','../instagram-algorithm-2026/','Tech & Social Media'),('Side Hustles You Can Start with Low Upfront Cost in India','../zero-investment-side-hustles/','Money & Career')]
              },
              'zero-investment-side-hustles': {
                  'title': 'Side Hustles You Can Start with Low Upfront Cost in India',
                  'category': 'Money & Career',
                  'category_href': '../../category/money-and-career/',
                  'tags': [('Side Hustle','../../tag/side-hustle/'),('Career','../../tag/career/'),('Freelancing','../../tag/freelancing/'),('India','../../tag/india/')],
                  'related': [('Instagram Algorithm Explained: What Actually Matters in 2026','../instagram-algorithm-2026/','Tech & Social Media'),('20 Signs Someone May Be Interested in You','../relationships-signs/','Relationships')]
              }
          }

          for slug, data in articles.items():
              path = base / slug / 'index.html'
              s = path.read_text()

              # Make category and tags genuinely navigable without changing the visual system.
              s = s.replace(f'<div class="cat">{data["category"]}</div>', f'<a class="cat" href="{data["category_href"]}">{data["category"]}</a>')
              old_tags = ''.join(f'<span>{name}</span>' for name, _ in data['tags'])
              new_tags = ''.join(f'<a href="{href}">{name}</a>' for name, href in data['tags'])
              s = s.replace(old_tags, new_tags)

              # Keep tag styling identical while making the pills accessible as links.
              s = s.replace('.tags span{border:1px solid var(--line);padding:6px 10px;color:#999;font-size:9px;text-transform:uppercase;letter-spacing:.12em}', '.tags a{border:1px solid var(--line);padding:6px 10px;color:#999;font-size:9px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none}.tags a:hover{color:var(--accent);border-color:var(--accent)}')
              s = s.replace('.tags span{font-size:8px;padding:5px 8px}', '.tags a{font-size:8px;padding:5px 8px}')

              related = '<section class="related"><div class="related-kicker">Continue Reading</div><h2>More from the writing</h2><div class="related-grid">'
              for title, href, cat in data['related']:
                  related += f'<a class="related-card" href="{href}"><span>{cat}</span><strong>{title}</strong><em>Read article →</em></a>'
              related += '</div></section>'

              css = '.related{max-width:680px;margin:70px auto 0;border-top:1px solid var(--line);padding-top:28px}.related-kicker{color:var(--accent);font-size:9px;text-transform:uppercase;letter-spacing:.2em}.related h2{font-size:30px;line-height:1.2;margin:12px 0 20px}.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.related-card{border:1px solid var(--line);padding:20px;text-decoration:none;display:flex;flex-direction:column;min-height:145px;transition:border-color .2s,transform .2s}.related-card:hover{border-color:var(--accent);transform:translateY(-2px)}.related-card span{color:var(--accent);font-size:8px;text-transform:uppercase;letter-spacing:.15em}.related-card strong{font-size:15px;line-height:1.35;margin-top:20px}.related-card em{font-style:normal;color:#777;font-size:8px;text-transform:uppercase;letter-spacing:.12em;margin-top:auto;padding-top:14px}.tags a:focus-visible,.related-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}@media(max-width:560px){.related{margin-top:50px;padding-top:22px}.related h2{font-size:25px}.related-grid{grid-template-columns:1fr}.related-card{min-height:125px;padding:18px}.related-card strong{font-size:14px;margin-top:16px}}'
              s = s.replace('</style></head>', css + '</style></head>')
              s = s.replace('</article><footer class="foot">', related + '</article><footer class="foot">')

              path.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/*/index.html
          git diff --cached --quiet || git commit -m "Add article category tag and related links"
          git push
