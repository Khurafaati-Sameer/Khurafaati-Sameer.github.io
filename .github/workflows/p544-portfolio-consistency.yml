name: P5.4.4 Portfolio Consistency
on:
  push:
    paths:
      - '.github/workflows/p544-portfolio-consistency.yml'
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical portfolio journey fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('projects.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="search/">Search</a></div></footer>'
          new = '<a href="search/">Search</a><a href="contact.html">Contact</a></div></footer>'
          if old in s and 'href="contact.html">Contact</a></div></footer>' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('visual-gallery.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="search/">Search</a></div></footer>'
          new = '<a href="search/">Search</a><a href="contact.html">Contact</a></div></footer>'
          if old in s and 'href="contact.html">Contact</a></div></footer>' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('project-case-study.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const archive=p===projects.adhuri?'visual-gallery.html#adhuri':p===projects.anshan?'visual-gallery.html#anshan':'projects.html';const archiveLabel=p===projects.portfolio?'Back to portfolio':'View full visual archive →';", "const archive=p===projects.adhuri?'visual-gallery.html#adhuri':p===projects.anshan?'visual-gallery.html#anshan':'projects.html';const archiveLabel=p===projects.adhuri||p===projects.anshan?'View full visual archive →':'Back to projects →';")
          s = s.replace('<a class="btn" href="projects.html">Back to projects</a></div></div></article></section></main>', '<a class="btn" href="projects.html">Back to projects</a><a class="btn" href="contact.html">Discuss a project →</a></div></div></article></section></main>')
          s = s.replace('<a href="search/">Search</a></div></footer>', '<a href="search/">Search</a><a href="contact.html">Contact</a></div></footer>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify portfolio journey
        run: |
          python - <<'PY'
          from pathlib import Path
          projects = Path('projects.html').read_text(encoding='utf-8')
          case = Path('project-case-study.html').read_text(encoding='utf-8')
          gallery = Path('visual-gallery.html').read_text(encoding='utf-8')
          assert 'project-case-study.html?project=business' in projects
          assert 'project-case-study.html?project=adhuri' in projects
          assert 'project-case-study.html?project=anshan' in projects
          assert 'visual-gallery.html#adhuri' in projects
          assert 'visual-gallery.html#anshan' in projects
          assert 'href="contact.html">Contact</a>' in projects
          assert 'href="contact.html">Discuss a project →</a>' in case
          assert 'href="contact.html">Contact</a>' in case
          assert 'visual-gallery.html#adhuri' in case
          assert 'visual-gallery.html#anshan' in case
          assert 'href="contact.html">Contact</a>' in gallery
          assert 'href="projects.html">Back to projects</a>' in case
          print('P5.4.4 portfolio journey verification: PASS')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.html visual-gallery.html project-case-study.html
          git diff --cached --quiet || git commit -m 'Polish portfolio storytelling journey'
          rm -f .github/workflows/p544-portfolio-consistency.yml
          git add .github/workflows/p544-portfolio-consistency.yml
          git commit -m 'Remove one-time P5.4.4 workflow'
          git push
