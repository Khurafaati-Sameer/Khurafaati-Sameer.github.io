name: Site Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Static site integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run static crawler
        run: python3 .github/scripts/site_audit.py

  live-audit:
    name: Live HTTP integrity
    runs-on: ubuntu-latest
    needs: static-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Pages deployment workflow
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflow_url="https://api.github.com/repos/Khurafaati-Sameer/Khurafaati-Sameer.github.io/actions/workflows/348470394/runs?branch=main&per_page=10"
          echo "Expected commit: ${EXPECTED_SHA}"
          for attempt in {1..60}; do
            http_code="$(curl -sS -o pages-runs.json -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$workflow_url")"
            echo "Attempt ${attempt}/60 — Pages workflow API HTTP status: ${http_code}"
            if [[ "$http_code" != "200" ]]; then
              echo "FAIL: Unable to read GitHub Pages workflow runs."
              cat pages-runs.json
              exit 1
            fi
            result="$(python3 -c 'import json,os; data=json.load(open("pages-runs.json")); expected=os.environ["EXPECTED_SHA"]; matches=[r for r in data.get("workflow_runs",[]) if r.get("head_sha")==expected]; print((matches[0].get("status","")+" "+(matches[0].get("conclusion") or "")+" "+str(matches[0].get("id",""))).strip() if matches else "NOT_FOUND")')"

            echo "Matching Pages run: ${result}"
            if [[ "$result" == "completed success "* ]]; then
              echo "PASS: GitHub Pages deployment workflow succeeded for the current commit."
              exit 0
            fi
            if [[ "$result" == completed* ]]; then
              echo "FAIL: GitHub Pages workflow for the current commit completed without success."
              exit 1
            fi
            sleep 5
          done
          echo "FAIL: GitHub Pages workflow for the current commit was not confirmed within 5 minutes."
          exit 1

      - name: Wait for GitHub Pages site to become reachable
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "Waiting for GitHub Pages site to become reachable..."
          for attempt in {1..60}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
            echo "Attempt ${attempt}/60 — live site HTTP status: ${status}"
            if [[ "$status" =~ ^2|^3 ]]; then
              echo "GitHub Pages is reachable. Proceeding to live audit."
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not become reachable with a 2xx/3xx response within 5 minutes."
          exit 1

      - name: Verify live site is reachable
        run: |
          set -euo pipefail
          status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
          echo "Live site HTTP status: ${status}"
          if [[ "$status" =~ ^2|^3 ]]; then
            exit 0
          fi
          echo "Live site returned a non-success HTTP status."
          exit 1

      - name: Run live HTTP crawler
        run: python3 .github/scripts/live_site_audit.py
