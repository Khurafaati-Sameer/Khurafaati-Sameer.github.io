name: Site Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Static site integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run static crawler
        run: python3 .github/scripts/site_audit.py

  live-audit:
    name: Live HTTP integrity
    runs-on: ubuntu-latest
    needs: static-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages site to become reachable
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "Waiting for GitHub Pages deployment to become reachable..."
          for attempt in {1..60}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
            echo "Attempt ${attempt}/60 — live site HTTP status: ${status}"
            if [[ "$status" =~ ^2|^3 ]]; then
              echo "GitHub Pages is reachable. Proceeding to live audit."
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not become reachable with a 2xx/3xx response within 5 minutes."
          exit 1

      - name: Verify live site is reachable
        run: |
          set -euo pipefail
          status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
          echo "Live site HTTP status: ${status}"
          if [[ "$status" =~ ^2|^3 ]]; then
            exit 0
          fi
          echo "Live site returned a non-success HTTP status."
          exit 1

      - name: Run live HTTP crawler
        run: python3 .github/scripts/live_site_audit.py
