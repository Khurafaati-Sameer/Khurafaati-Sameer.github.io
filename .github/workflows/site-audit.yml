name: Site Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Static site integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run static crawler
        run: python3 .github/scripts/site_audit.py

  live-audit:
    name: Live HTTP integrity
    runs-on: ubuntu-latest
    needs: static-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Pages deployment freshness
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/Khurafaati-Sameer/Khurafaati-Sameer.github.io/pages/builds?per_page=10'
          echo "Expected deployment commit: ${EXPECTED_SHA}"
          echo "Checking recent GitHub Pages builds..."
          json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$api")"
          python3 - "$EXPECTED_SHA" <<'PY' <<<"$json"
          import json, sys
          expected = sys.argv[1]
          builds = json.load(sys.stdin)
          match = next((b for b in builds if b.get('commit') == expected), None)
          if not match:
              print('FAIL: No recent GitHub Pages build matches the current commit.')
              print('Recent build commits:')
              for build in builds:
                  print(f"- {build.get('commit')} status={build.get('status')} updated_at={build.get('updated_at')}")
              raise SystemExit(1)
          print(f"Matched Pages build: {match.get('commit')}")
          print(f"Pages build status: {match.get('status')}")
          if match.get('status') != 'built':
              print('FAIL: Matching Pages build exists but is not built.')
              raise SystemExit(1)
          print('PASS: GitHub Pages build matches the current commit and is built.')
          PY

          deployment_url="https://api.github.com/repos/Khurafaati-Sameer/Khurafaati-Sameer.github.io/pages/deployments/${EXPECTED_SHA}"
          echo "Checking Pages deployment status for ${EXPECTED_SHA}..."
          deployment_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$deployment_url")"
          deployment_status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<<"$deployment_json")"
          echo "Pages deployment status: ${deployment_status}"
          if [[ "$deployment_status" != "succeed" ]]; then
            echo "FAIL: Pages deployment for the current commit is not in succeed state."
            exit 1
          fi
          echo "PASS: GitHub Pages deployment is current and succeeded."

      - name: Wait for GitHub Pages site to become reachable
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "Waiting for GitHub Pages site to become reachable..."
          for attempt in {1..60}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
            echo "Attempt ${attempt}/60 — live site HTTP status: ${status}"
            if [[ "$status" =~ ^2|^3 ]]; then
              echo "GitHub Pages is reachable. Proceeding to live audit."
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not become reachable with a 2xx/3xx response within 5 minutes."
          exit 1

      - name: Verify live site is reachable
        run: |
          set -euo pipefail
          status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
          echo "Live site HTTP status: ${status}"
          if [[ "$status" =~ ^2|^3 ]]; then
            exit 0
          fi
          echo "Live site returned a non-success HTTP status."
          exit 1

      - name: Run live HTTP crawler
        run: python3 .github/scripts/live_site_audit.py
