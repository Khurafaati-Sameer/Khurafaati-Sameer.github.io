name: Site Integrity Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    name: Static site integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run static crawler
        run: python3 .github/scripts/site_audit.py

  live-audit:
    name: Live HTTP integrity
    runs-on: ubuntu-latest
    needs: static-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Pages deployment freshness
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_url="https://api.github.com/repos/Khurafaati-Sameer/Khurafaati-Sameer.github.io/pages/deployments/${EXPECTED_SHA}"
          echo "Expected deployment commit: ${EXPECTED_SHA}"
          echo "Checking GitHub Pages deployment by commit SHA..."

          for attempt in {1..60}; do
            http_code="$(curl -sS -o deployment.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$deployment_url")"

            echo "Attempt ${attempt}/60 — Pages deployment API HTTP status: ${http_code}"

            if [[ "$http_code" == "200" ]]; then
              deployment_status="$(python3 -c 'import json; print(json.load(open("deployment.json")).get("status", ""))')"
              deployment_sha="$(python3 -c 'import json; print(json.load(open("deployment.json")).get("sha", ""))')"
              echo "Pages deployment SHA: ${deployment_sha}"
              echo "Pages deployment status: ${deployment_status}"

              if [[ "$deployment_sha" != "$EXPECTED_SHA" ]]; then
                echo "FAIL: Pages deployment SHA does not match the current commit."
                exit 1
              fi

              if [[ "$deployment_status" != "succeed" ]]; then
                echo "FAIL: Pages deployment exists for the current commit but has not succeeded."
                exit 1
              fi

              echo "PASS: GitHub Pages deployment matches the current commit and succeeded."
              exit 0
            fi

            if [[ "$http_code" != "404" ]]; then
              echo "FAIL: Unexpected Pages deployment API response: HTTP ${http_code}"
              cat deployment.json
              exit 1
            fi

            sleep 5
          done

          echo "FAIL: GitHub Pages deployment for the current commit was not visible within 5 minutes."
          exit 1

      - name: Wait for GitHub Pages site to become reachable
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "Waiting for GitHub Pages site to become reachable..."
          for attempt in {1..60}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
            echo "Attempt ${attempt}/60 — live site HTTP status: ${status}"
            if [[ "$status" =~ ^2|^3 ]]; then
              echo "GitHub Pages is reachable. Proceeding to live audit."
              exit 0
            fi
            sleep 5
          done
          echo "Live site did not become reachable with a 2xx/3xx response within 5 minutes."
          exit 1

      - name: Verify live site is reachable
        run: |
          set -euo pipefail
          status="$(curl -L -s -o /dev/null -w '%{http_code}' https://khurafaati-sameer.github.io/)"
          echo "Live site HTTP status: ${status}"
          if [[ "$status" =~ ^2|^3 ]]; then
            exit 0
          fi
          echo "Live site returned a non-success HTTP status."
          exit 1

      - name: Run live HTTP crawler
        run: python3 .github/scripts/live_site_audit.py
